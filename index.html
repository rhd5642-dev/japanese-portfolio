<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일본어 수업 포트폴리오</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', 'Inter', sans-serif; background-color: #f8fafc; }
        .hidden-view { display: none !important; }
        .tab-active { border-bottom: 2px solid #6366f1; color: #4f46e5; font-weight: 600; }
        .tab-inactive { color: #6b7280; font-weight: 500; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #c7c7cc; border-radius: 4px; }
        
        .toast-enter { animation: toastIn 0.3s ease-out forwards; }
        .toast-exit { animation: toastOut 0.3s ease-in forwards; }
        @keyframes toastIn { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes toastOut { from { transform: translateY(0); opacity: 1; } to { transform: translateY(100%); opacity: 0; } }
        
        .loader {
            border: 3px solid #f3f3f3; border-radius: 50%; border-top: 3px solid #6366f1;
            width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-gray-800 h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="bg-white shadow-sm border-b border-gray-200 z-10 flex-shrink-0">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center gap-2">
                    <div class="bg-indigo-100 p-2 rounded-lg text-indigo-600">
                        <i class="fa-solid fa-language text-xl"></i>
                    </div>
                    <span class="font-bold text-xl tracking-tight text-gray-900">일본어 수업 포트폴리오</span>
                </div>
                <div class="flex items-center">
                    <button id="modeToggleBtn" type="button" class="text-sm bg-indigo-600 hover:bg-indigo-700 text-white py-2 px-4 rounded-lg transition font-medium shadow-sm flex items-center gap-2">
                        <i class="fa-solid fa-user-gear"></i> <span id="modeToggleText">교사용으로 전환</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Teacher Auth Modal -->
    <div id="teacherAuthModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden-view p-4">
        <div class="bg-white rounded-xl shadow-xl max-w-sm w-full p-6 space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-bold text-lg flex items-center gap-2"><i class="fa-solid fa-lock text-indigo-600"></i> 교사용 인증</h3>
                <button id="closeAuthModalBtn" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="teacherAuthForm" class="space-y-4">
                <input type="password" id="teacherPasswordInput" placeholder="비밀번호 입력" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" id="cancelAuthBtn" class="px-4 py-2 text-sm text-gray-600 bg-gray-100 rounded-lg">취소</button>
                    <button type="submit" class="px-4 py-2 text-sm bg-indigo-600 text-white rounded-lg">확인</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Main Content -->
    <main class="flex-grow overflow-y-auto pb-20">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
            
            <div id="teacherTabs" class="hidden-view mb-6 border-b flex gap-6">
                <button id="tab-record" class="pb-3 px-1 tab-active">기록 및 도장 부여</button>
                <button id="tab-notice" class="pb-3 px-1 tab-inactive">알림사항 관리</button>
            </div>

            <!-- Student View -->
            <div id="studentView">
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-6">
                    <h2 class="text-lg font-bold mb-4 flex items-center gap-2"><i class="fa-solid fa-magnifying-glass text-indigo-500"></i> 나의 기록 찾기</h2>
                    <form id="searchForm" class="flex flex-col sm:flex-row gap-3">
                        <input type="text" id="searchName" placeholder="이름 (예: 홍길동)" required class="flex-1 px-4 py-2 border rounded-lg">
                        <input type="password" id="searchPassword" placeholder="비밀번호(학번)" required class="flex-1 px-4 py-2 border rounded-lg">
                        <button type="submit" id="searchBtn" class="bg-indigo-600 text-white py-2 px-6 rounded-lg">조회하기</button>
                    </form>
                </div>
            </div>

            <!-- Teacher Record View -->
            <div id="recordTab" class="hidden-view">
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 max-w-3xl mx-auto">
                    <h2 class="text-xl font-bold mb-6 border-b pb-3 flex items-center gap-2"><i class="fa-solid fa-stamp text-indigo-500"></i> 도장 일괄 부여하기</h2>
                    
                    <form id="addRecordForm" class="space-y-6">
                        <div class="grid grid-cols-2 gap-4">
                            <div><label class="block text-sm font-medium mb-1">날짜</label><input type="date" id="recordDate" required class="w-full px-4 py-2 border rounded-lg"></div>
                            <div>
                                <label class="block text-sm font-medium mb-1">회차 선택</label>
                                <select id="recordSession" required class="w-full px-4 py-2 border rounded-lg">
                                    <option value="" disabled selected>회차 선택</option>
                                    <option value="1회차">1회차</option><option value="2회차">2회차</option>
                                    <option value="3회차">3회차</option><option value="4회차">4회차</option>
                                    <option value="5회차">5회차</option><option value="6회차">6회차</option>
                                    <option value="7회차">7회차</option><option value="8회차">8회차</option>
                                    <option value="9회차">9회차</option><option value="10회차">10회차</option>
                                </select>
                            </div>
                        </div>

                        <!-- 반 선택 및 학생 다중 선택 UI -->
                        <div class="bg-indigo-50 p-4 rounded-lg border border-indigo-100">
                            <label class="block text-sm font-bold text-indigo-700 mb-2">1. 반 선택</label>
                            <select id="classSelect" class="w-full px-4 py-2 border border-gray-300 rounded-lg mb-4 bg-white outline-none focus:ring-2 focus:ring-indigo-500">
                                <option value="" disabled selected>명렬표를 불러오는 중입니다...</option>
                            </select>

                            <div class="flex justify-between items-end mb-2">
                                <label class="block text-sm font-bold text-indigo-700">2. 학생 선택 (다중 선택 가능)</label>
                                <div class="flex gap-2">
                                    <button type="button" id="selectAllBtn" class="text-xs px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-md transition cursor-pointer">전체 선택</button>
                                    <button type="button" id="deselectAllBtn" class="text-xs px-3 py-1.5 bg-gray-300 hover:bg-gray-400 text-gray-700 rounded-md transition cursor-pointer">선택 해제</button>
                                </div>
                            </div>
                            <!-- 동적 학생 목록 그리드 -->
                            <div id="studentGrid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-2 max-h-64 overflow-y-auto p-3 border border-gray-200 rounded-lg bg-white">
                                <div class="col-span-full text-center text-gray-400 text-sm py-4">반을 먼저 선택해주세요.</div>
                            </div>
                        </div>

                        <!-- 평가 항목 -->
                        <div>
                            <label class="block text-sm font-medium mb-2">3. 평가 항목</label>
                            <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                                <label class="border rounded-lg p-3 cursor-pointer flex flex-col items-center gap-2 has-[:checked]:border-indigo-500 has-[:checked]:bg-indigo-50">
                                    <input type="radio" name="category" value="참 잘했어요" class="sr-only" required><span class="text-2xl">💮</span><span class="text-sm font-medium">참 잘했어요</span>
                                </label>
                                <label class="border rounded-lg p-3 cursor-pointer flex flex-col items-center gap-2 has-[:checked]:border-indigo-500 has-[:checked]:bg-indigo-50">
                                    <input type="radio" name="category" value="분발하세요" class="sr-only"><span class="text-2xl">😢</span><span class="text-sm font-medium">분발하세요</span>
                                </label>
                                <label class="border rounded-lg p-3 cursor-pointer flex flex-col items-center gap-2 has-[:checked]:border-green-500 has-[:checked]:bg-green-50">
                                    <input type="radio" name="category" value="학습지 완료" class="sr-only"><span class="text-2xl">📝</span><span class="text-sm font-medium">학습지 완료</span>
                                </label>
                            </div>
                        </div>

                        <button type="submit" id="submitRecordBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg flex justify-center gap-2 cursor-pointer transition">
                            선택한 학생들에게 부여하기
                        </button>
                    </form>
                </div>
            </div>
            
            <div id="noticeTab" class="hidden-view"><div class="bg-white rounded-xl shadow-sm p-6 text-center text-gray-500 py-10">알림사항 준비중</div></div>
        </div>
    </main>

    <div id="toastContainer" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3 pointer-events-none"></div>

    <script>
        // 🚨 선생님께서 주신 웹앱 주소를 전역 변수로 설정했습니다! 🚨
        const MY_GAS_URL = "https://script.google.com/macros/s/AKfycbxW-Kv6RuSUoRk6UrxWzpoU3NNY647gmZkhgvWCzFcuGE7KRpEfkb0DEYnP5g6n9b4N/exec";

        let isTeacherMode = false;
        let allStudents = [];

        // 오늘 날짜를 기본값으로 설정
        document.getElementById('recordDate').valueAsDate = new Date();

        // 1️⃣ 구글 시트에서 학생 명단 불러오기 (fetch를 통한 POST 방식)
        async function fetchStudentList() {
            try {
                const classSelect = document.getElementById('classSelect');
                classSelect.innerHTML = '<option value="" disabled selected>명렬표를 불러오는 중입니다 <span class="loader align-middle ml-2 w-4 h-4"></span></option>';
                
                const response = await fetch(MY_GAS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'getStudentList' })
                });
                const result = await response.json();
                
                if (result.success) {
                    allStudents = result.data;
                    updateClassSelect();
                } else {
                    showToast("명렬표 로드 실패: " + result.message, "error");
                }
            } catch (e) {
                showToast("명렬표를 불러오는 중 오류가 발생했습니다.", "error");
                console.error(e);
            }
        }

        // 2️⃣ 불러온 데이터로 반 선택 드롭다운 만들기
        function updateClassSelect() {
            const classes = [...new Set(allStudents.map(s => s.className))].sort((a,b) => a.localeCompare(b, undefined, {numeric:true}));
            const select = document.getElementById('classSelect');
            
            select.innerHTML = '<option value="" disabled selected>반을 선택해주세요</option>';
            classes.forEach(cls => {
                select.innerHTML += `<option value="${cls}">${cls}</option>`;
            });

            select.addEventListener('change', (e) => {
                renderStudentsGrid(e.target.value);
            });
        }

        // 3️⃣ 선택한 반의 학생들만 그리드로 그리기
        function renderStudentsGrid(selectedClass) {
            const studentGrid = document.getElementById('studentGrid');
            const classStudents = allStudents.filter(s => s.className === selectedClass);
            
            if(classStudents.length === 0) {
                studentGrid.innerHTML = '<div class="col-span-full text-center text-gray-500 py-4">해당 반에 학생이 없습니다.</div>';
                return;
            }

            studentGrid.innerHTML = classStudents.map(student => {
                const val = `${student.studentNum} ${student.name}`; // "10101 홍길동" 형식으로 시트에 저장
                return `
                <label class="cursor-pointer block relative">
                    <input type="checkbox" name="selectedStudents" value="${val}" class="peer sr-only">
                    <div class="text-center px-1 py-2 text-sm border border-gray-300 rounded-lg bg-gray-50 text-gray-700 peer-checked:bg-indigo-600 peer-checked:text-white peer-checked:border-indigo-600 hover:bg-gray-100 transition-colors shadow-sm select-none">
                        <div class="text-[10px] opacity-70 mb-0.5">${student.studentNum}</div>
                        <div class="font-bold">${student.name}</div>
                    </div>
                </label>
            `}).join('');
        }

        document.getElementById('selectAllBtn').addEventListener('click', () => {
            document.querySelectorAll('input[name="selectedStudents"]').forEach(cb => cb.checked = true);
        });
        document.getElementById('deselectAllBtn').addEventListener('click', () => {
            document.querySelectorAll('input[name="selectedStudents"]').forEach(cb => cb.checked = false);
        });

        // 로그인 및 탭 전환
        const modal = document.getElementById('teacherAuthModal');
        document.getElementById('modeToggleBtn').addEventListener('click', () => {
            if (!isTeacherMode) { modal.classList.remove('hidden-view'); } 
            else { location.reload(); }
        });
        document.getElementById('closeAuthModalBtn').addEventListener('click', () => modal.classList.add('hidden-view'));
        document.getElementById('cancelAuthBtn').addEventListener('click', () => modal.classList.add('hidden-view'));

        // 🚨 비밀번호를 1207로 변경 완료! 🚨
        document.getElementById('teacherAuthForm').addEventListener('submit', (e) => {
            e.preventDefault();
            if (document.getElementById('teacherPasswordInput').value === '1207') {
                isTeacherMode = true; 
                modal.classList.add('hidden-view');
                document.getElementById('modeToggleText').innerText = "학생용으로 전환";
                document.getElementById('studentView').classList.add('hidden-view');
                document.getElementById('teacherTabs').classList.remove('hidden-view');
                document.getElementById('recordTab').classList.remove('hidden-view');
                
                // 로그인 성공 시 명렬표 로드
                fetchStudentList(); 
            } else { 
                showToast("비밀번호가 일치하지 않습니다.", "error"); 
            }
        });

        // 도장 일괄 부여 전송
        document.getElementById('addRecordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitRecordBtn');
            const originalBtnHtml = btn.innerHTML;
            
            const selectedCheckboxes = document.querySelectorAll('input[name="selectedStudents"]:checked');
            const namesArray = Array.from(selectedCheckboxes).map(cb => cb.value);

            if (namesArray.length === 0) {
                showToast("학생을 1명 이상 선택해주세요.", "error");
                return;
            }

            const payload = {
                action: "addRecordsBulk",
                names: namesArray,
                date: document.getElementById('recordDate').value,
                session: document.getElementById('recordSession').value,
                category: document.querySelector('input[name="category"]:checked').value
            };

            try {
                btn.innerHTML = `<span class="loader border-white border-t-indigo-200"></span> 전송 중...`;
                btn.disabled = true;

                // 통신에 전역 변수 MY_GAS_URL을 사용합니다.
                const response = await fetch(MY_GAS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                
                if (result.success) {
                    showToast(`${namesArray.length}명에게 도장을 부여했습니다!`, "success");
                    document.querySelectorAll('input[name="selectedStudents"]').forEach(cb => cb.checked = false);
                } else { showToast("오류: " + result.message, "error"); }
            } catch (error) {
                showToast("통신 오류가 발생했습니다.", "error");
            } finally {
                btn.innerHTML = originalBtnHtml;
                btn.disabled = false;
            }
        });

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            let styles = type === 'success' ? 'bg-green-100 text-green-800' : type === 'error' ? 'bg-red-100 text-red-800' : 'bg-indigo-100 text-indigo-800';
            toast.className = `flex items-center gap-3 px-4 py-3 rounded-lg shadow-lg text-sm font-medium toast-enter ${styles}`;
            toast.innerHTML = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.replace('toast-enter', 'toast-exit');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>
</body>
</html>
