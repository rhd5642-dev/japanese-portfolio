<script>
        // --- State & Initialization ---
        let isTeacherMode = false;
        let currentTab = 'record';
        
        // 선생님이 주신 기본 GAS URL을 초기값으로 세팅
        const DEFAULT_GAS_URL = "https://script.google.com/macros/s/AKfycbwarE2Dxr3_0hOuYLnNh-pX3YwYGcw9FqlgODefDoVnxwp-Jv4G15NiozlP1Wh-KQp2/exec";
        let teacherPassword = localStorage.getItem('teacherPassword') || '1234';
        let gasUrl = localStorage.getItem('gasUrl') || DEFAULT_GAS_URL;
        
        // --- DOM Elements ---
        const modeToggleBtn = document.getElementById('modeToggleBtn');
        const modeToggleText = document.getElementById('modeToggleText');
        const teacherAuthModal = document.getElementById('teacherAuthModal');
        const teacherAuthForm = document.getElementById('teacherAuthForm');
        
        const studentView = document.getElementById('studentView');
        const teacherTabs = document.getElementById('teacherTabs');
        const recordTab = document.getElementById('recordTab');
        const noticeTab = document.getElementById('noticeTab');
        const manageTab = document.getElementById('manageTab');
        
        // --- UI Helper Functions ---
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            const bgColor = type === 'success' ? 'bg-indigo-600' : 'bg-red-500';
            const icon = type === 'success' ? 'fa-check-circle' : 'fa-circle-exclamation';
            
            toast.className = `${bgColor} text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-2 toast-enter pointer-events-auto`;
            toast.innerHTML = `<i class="fa-solid ${icon}"></i> <span class="text-sm font-medium">${message}</span>`;
            
            document.getElementById('toastContainer').appendChild(toast);
            
            setTimeout(() => {
                toast.classList.replace('toast-enter', 'toast-exit');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // --- Mode Switching ---
        modeToggleBtn.addEventListener('click', () => {
            if (!isTeacherMode) {
                teacherAuthModal.classList.remove('hidden-view');
            } else {
                isTeacherMode = false;
                modeToggleBtn.innerHTML = `<i class="fa-solid fa-user-gear"></i> <span id="modeToggleText">교사용으로 전환</span>`;
                studentView.classList.remove('hidden-view');
                teacherTabs.classList.add('hidden-view');
                recordTab.classList.add('hidden-view');
                noticeTab.classList.add('hidden-view');
                manageTab.classList.add('hidden-view');
                showToast('학생 모드로 전환되었습니다.');
            }
        });

        document.getElementById('closeAuthModalBtn').addEventListener('click', () => teacherAuthModal.classList.add('hidden-view'));
        document.getElementById('cancelAuthBtn').addEventListener('click', () => teacherAuthModal.classList.add('hidden-view'));

        teacherAuthForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const input = document.getElementById('teacherPasswordInput').value;
            if (input === teacherPassword) {
                isTeacherMode = true;
                teacherAuthModal.classList.add('hidden-view');
                document.getElementById('teacherPasswordInput').value = '';
                
                modeToggleBtn.innerHTML = `<i class="fa-solid fa-user-graduate"></i> <span id="modeToggleText">학생용으로 전환</span>`;
                studentView.classList.add('hidden-view');
                teacherTabs.classList.remove('hidden-view');
                switchTab('record');
                showToast('교사 모드로 인증되었습니다.');
                
                document.getElementById('gasUrlInput').value = gasUrl;
            } else {
                showToast('비밀번호가 일치하지 않습니다.', 'error');
            }
        });

        // --- Teacher Tabs Logic ---
        const tabs = {
            record: { btn: document.getElementById('tab-record'), view: recordTab },
            notice: { btn: document.getElementById('tab-notice'), view: noticeTab },
            manage: { btn: document.getElementById('tab-manage'), view: manageTab }
        };

        function switchTab(tabId) {
            Object.keys(tabs).forEach(id => {
                tabs[id].btn.className = 'pb-3 px-1 cursor-pointer ' + (id === tabId ? 'tab-active' : 'tab-inactive');
                if (id === tabId) {
                    tabs[id].view.classList.remove('hidden-view');
                } else {
                    tabs[id].view.classList.add('hidden-view');
                }
            });
            currentTab = tabId;
        }

        document.getElementById('tab-record').addEventListener('click', () => switchTab('record'));
        document.getElementById('tab-notice').addEventListener('click', () => switchTab('notice'));
        document.getElementById('tab-manage').addEventListener('click', () => switchTab('manage'));

        // --- Student Search (GET 요청) ---
        document.getElementById('searchForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const searchName = document.getElementById('searchName').value.trim();
            const searchPassword = document.getElementById('searchPassword').value.trim();
            
            showToast('데이터를 불러오는 중입니다...', 'success');
            
            try {
                // 구글 시트에서 학생 데이터 조회 (이름, 비밀번호 매칭)
                const response = await fetch(`${gasUrl}?type=search&name=${encodeURIComponent(searchName)}&password=${encodeURIComponent(searchPassword)}`);
                const data = await response.json();
                
                if (data.error) {
                    showToast('학생 정보를 찾을 수 없거나 비밀번호가 틀렸습니다.', 'error');
                    return;
                }

                showToast(`${searchName} 학생의 데이터를 불러왔습니다.`);
                document.getElementById('dashboardContent').classList.remove('hidden-view');
                
                document.getElementById('displayName').innerText = data.name || searchName;
                document.getElementById('displayClass').innerText = data.class || '';
                
                // 받아온 데이터로 UI 업데이트 (키값은 구글 앱스 스크립트 설정에 따라 변경 필요)
                updateStamps('goodStampBoard', 10, data.goodStamps || 0, '💮');
                updateStamps('effortStampBoard', 5, data.effortStamps || 0, '😢');
                updateStamps('worksheetStampBoard', 10, data.worksheetStamps || 0, '📝');
                
                document.getElementById('participationScoreCount').innerText = data.participationScore || 0;
                document.getElementById('worksheetScoreCount').innerText = data.worksheetScore || 0;
                document.getElementById('totalScore').innerText = data.totalScore || 0;
                
                setTimeout(() => {
                    const total = data.totalScore || 0;
                    document.getElementById('scoreProgressBar').style.width = `${total}%`;
                }, 100);

            } catch (error) {
                console.error(error);
                showToast('서버 통신 중 오류가 발생했습니다.', 'error');
            }
        });

        function updateStamps(containerId, maxSlots, currentCount, icon) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            document.getElementById(containerId.replace('Board', 'Count')).innerText = currentCount;
            
            for (let i = 0; i < maxSlots; i++) {
                const stamp = document.createElement('div');
                if (i < currentCount) {
                    stamp.className = 'stamp-slot stamp-filled shadow-sm';
                    stamp.innerHTML = icon;
                } else {
                    stamp.className = 'stamp-slot stamp-empty';
                }
                container.appendChild(stamp);
            }
        }

        // --- 교사 기록 추가 (POST 요청) ---
        document.getElementById('addRecordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = e.target.querySelector('button[type="submit"]');
            submitBtn.innerText = "저장 중...";
            submitBtn.disabled = true;

            const postData = {
                type: 'record',
                date: document.getElementById('recordDate').value,
                session: document.getElementById('recordSession').value,
                name: document.getElementById('recordName').value,
                category: document.querySelector('input[name="category"]:checked').value,
                score: document.getElementById('recordScore').value || 0
            };

            try {
                const response = await fetch(gasUrl, {
                    method: 'POST',
                    body: JSON.stringify(postData)
                });
                const result = await response.json();
                
                if(result.success) {
                    showToast('기록이 성공적으로 저장되었습니다!');
                    e.target.reset();
                    scoreInputContainer.classList.add('hidden-view');
                } else {
                    showToast('저장에 실패했습니다.', 'error');
                }
            } catch (error) {
                console.error(error);
                showToast('통신 오류가 발생했습니다.', 'error');
            } finally {
                submitBtn.innerText = "기록 저장하기";
                submitBtn.disabled = false;
            }
        });

        // --- Settings & Auth Changes ---
        document.getElementById('saveGasBtn').addEventListener('click', () => {
            const url = document.getElementById('gasUrlInput').value;
            localStorage.setItem('gasUrl', url);
            gasUrl = url;
            showToast('GAS URL이 저장되었습니다.');
        });

        const changePassModal = document.getElementById('changePassModal');
        document.getElementById('openChangePassBtn').addEventListener('click', () => changePassModal.classList.remove('hidden-view'));
        document.getElementById('closeChangePassModalBtn').addEventListener('click', () => changePassModal.classList.add('hidden-view'));
        document.getElementById('cancelChangePassBtn').addEventListener('click', () => changePassModal.classList.add('hidden-view'));

        document.getElementById('changePassForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const currentPass = document.getElementById('currentPassInput').value;
            const newPass = document.getElementById('newPassInput').value;
            
            if (currentPass !== teacherPassword) {
                showToast('현재 비밀번호가 틀렸습니다.', 'error');
                return;
            }
            
            teacherPassword = newPass;
            localStorage.setItem('teacherPassword', newPass);
            showToast('비밀번호가 성공적으로 변경되었습니다.');
            changePassModal.classList.add('hidden-view');
            e.target.reset();
        });

        const categoryRadios = document.querySelectorAll('input[name="category"]');
        const scoreInputContainer = document.getElementById('scoreInputContainer');
        const recordScore = document.getElementById('recordScore');

        categoryRadios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                if (['participationScore', 'worksheetScore', 'score'].includes(e.target.value)) {
                    scoreInputContainer.classList.remove('hidden-view');
                    recordScore.required = true;
                } else {
                    scoreInputContainer.classList.add('hidden-view');
                    recordScore.required = false;
                }
            });
        });
    </script>
